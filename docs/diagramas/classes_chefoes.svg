 UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">portais privados</text><text x="1008" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">register, portal, lawsuit</text><rect x="40" y="700" width="220" height="115" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="40" y="700" width="220" height="44" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="150" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b3fd6" text-anchor="middle">«O ALGORITMO · distrito 6»</text><text x="150" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Algorithm</text><line x1="40" y1="788" x2="260" y2="788" stroke="#1d1b2e" stroke-width="1"/><text x="48" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">núcleo + satélites</text><text x="48" y="779" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">ondas de desvio</text><text x="48" y="806" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">pulse, spam, viral</text><rect x="280" y="700" width="220" height="115" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="280" y="700" width="220" height="44" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="390" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b3fd6" text-anchor="middle">«O CENSOR · distrito 7»</text><text x="390" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Censor</text><line x1="280" y1="788" x2="500" y2="788" stroke="#1d1b2e" stroke-width="1"/><text x="288" y="762" font-family="Segoe UI, Arial, sans-serif" 
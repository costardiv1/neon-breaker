<text x="620" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d1b2e" text-anchor="middle">Diagrama de classes: chefões</text><text x="620" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6880" text-anchor="middle">createBoss(tipo, game) escolhe a subclasse pelo campo boss.type de cada distrito</text><rect x="430" y="80" width="380" height="251" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="430" y="80" width="380" height="44" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="620" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b3fd6" text-anchor="middle">«abstrata»</text><text x="620" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle" font-style="italic">Boss</text><line x1="430" y1="185" x2="810" y2="185" stroke="#1d1b2e" stroke-width="1"/><text x="438" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start"># g: Game</text><text x="438" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start"># name, lives = 2, hp, hpMax</text><text x="438" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start"># fury, inv, charge, abilityT, coreCool</text><text x="438" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ update(dt)</text><text x="438" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ damage(n, force, minor)</text><text x="438" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start"># enterFury()  ·  die()</text><text x="438" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start"># shootAtPlayer(n)  ·  throwBall(b)</text><text x="438" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start" font-style="italic">+ move(dt)  abstract</text><text x="438" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start" font-style="italic">+ pickAbility()  ·  exec(a)  abstract</text><text x="438" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start" font-style="italic">+ collide(b)  ·  hitShot(x, y, r)  abstract</text><text x="438" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start" font-style="italic">+ holdBall(b, dt)  ·  render(c)  abstract</text><rect x="40" y="470" width="220" height="115" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="40" y="470" width="220" height="44" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="150" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b3fd6" text-anchor="middle">«SENTINELA · distrito 1»</text><text x="150" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Sentinel</text><line x1="40" y1="558" x2="260" y2="558" stroke="#1d1b2e" stroke-width="1"/><text x="48" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">núcleo sob o casco</text><text x="48" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">íris abre e fecha</text><text x="48" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">deflect, capture, summon</text><rect x="280" y="470" width="2
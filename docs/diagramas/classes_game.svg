<rect width="100%" height="100%" fill="#ffffff"/>
<text x="590" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d1b2e" text-anchor="middle">Diagrama de classes: Game e entidades da partida</text><text x="590" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6880" text-anchor="middle">entidades são objetos simples (JS) criados e atualizados pelo Game</text><rect x="390" y="80" width="400" height="390" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="390" y="80" width="400" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="590" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Game</text><line x1="390" y1="307" x2="790" y2="307" stroke="#1d1b2e" stroke-width="1"/><text x="398" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- stage: Stage</text><text x="398" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- paddle: Paddle</text><text x="398" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- balls: Ball[ ]</text><text x="398" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- bricks: Brick[ ]</text><text x="398" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- drops: Drop[ ]</text><text x="398" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- coins: Coin[ ]</text><text x="398" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- effects: Map&lt;tipo, Effect&gt;</text><text x="398" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- wells: Well[ ]  ·  portals: Portal[ ]</text><text x="398" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- boss: Boss | null</text><text x="398" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- energy: 0..1  ·  ability: Ability</text><text x="398" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- score, lives, combo</text><text x="398" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ newGame(index)</text><text x="398" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ loadLevel()</text><text x="398" y="359" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ update(dt)  ·  render(c)</text><text x="398" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ launch()  ·  useAbility()</text><text x="398" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ applyPower(tipo, n)</text><text x="398" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- paddleHit(b)  ·  brickHit(b)</text><text x="398" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- damage(brick, full, amt)</text><text x="398" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">- updateMechanics(dt)  ·  checkPortals(b)</text><text x="398" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">+ emit(evento, dado)</text><rect x="40" y="120" width="250" height="82" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="40" y="120" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="165" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Paddle</text><line x1="40" y1="194" x2="290" y2="194" stroke="#1d1b2e" stroke-width="1"/><text x="48" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">x, tx, y, hw</text><text x="48" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">hit (animação 0..1)</text><rect x="40" y="300" width="250" height="99" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="40" y="300" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="165" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Ball</text><line x1="40" y1="391" x2="290" y2="391" stroke="#1d1b2e" stroke-width="1"/><text x="48" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">x, y, vx, vy, s, r</text><text x="48" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">path (rastro), spin</text><text x="48" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">held, cap, fade, pcd</text><rect x="40" y="500" width="250" height="99" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="40" y="500" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="165" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Brick</text><line x1="40" y1="591" x2="290" y2="591" stroke="#1d1b2e" stroke-width="1"/><text x="48" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">x, y, w, h, hp</text><text x="48" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">kind: 'n' | 'wall' | 'exp'</text><text x="48" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">row, col, phase?, out?, reg?</text><rect x="390" y="640" width="230" height="65" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="390" y="640" width="230" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="505" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Drop</text><line x1="390" y1="697" x2="620" y2="697" stroke="#1d1b2e" stroke-width="1"/><text x="398" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">x, y, type, n (x2)</text><rect x="650" y="640" width="200" height="65" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="650" y="640" width="200" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="750" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Coin</text><line x1="650" y1="697" x2="850" y2="697" stroke="#1d1b2e" stroke-width="1"/><text x="658" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">x, y, vy, t</text><rect x="890" y="100" width="250" height="82" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="890" y="100" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="1015" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Effect</text><line x1="890" y1="174" x2="1140" y2="174" stroke="#1d1b2e" stroke-width="1"/><text x="898" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">type, t, max, good</text><text x="898" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">lvl? (tamanho)  ammo? (laser)</text><rect x="890" y="280" width="250" height="99" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="890" y="280" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="1015" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Ability</text><line x1="890" y1="371" x2="1140" y2="371" stroke="#1d1b2e" stroke-width="1"/><text x="898" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">type: megalaser | shock |</text><text x="898" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">  shield | magnet | slow | bolt</text><text x="898" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="start">lvl: 1..3</text><rect x="890" y="460" width="250" height="82" rx="4" fill="#fff" stroke="#1d1b2e" stroke-width="1.4"/><rect x="890" y="460" width="250" height="30" rx="4" fill="#f3effc" stroke="#1d1b2e" stroke-width="1.4"/><text x="1015" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1b2e" text-anchor="middle">Well / Portal</text><line x1="890" y1="534" x2="1140" y2="534" stroke="#1d1b2e" stroke-width="1"/><text x="898" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d1b2e" text-anchor="